[build]
  command = "npm run build"
  publish = "out"


[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache frame images for ultra-fast scrubbing and zero latency
[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
